<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<title>Villa Bianca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --ink:#1f2a2e; --muted:#6b7478; --line:#e6e0d4;
  --accent:#2f5d62; --accent-soft:#e3ecea; --gold:#b08d57; --ok:#2e7d4f; --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
h1,h2{font-family:"Cormorant Garamond",serif;font-weight:600;letter-spacing:.01em}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px}
.brand{font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;padding:6px 12px;font:600 12px Inter;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--accent);color:#fff}
.hero{margin:12px 0 20px;padding:28px 22px;border-radius:var(--radius);background:linear-gradient(160deg,#ffffff 0%,#efe9dd 100%);border:1px solid var(--line)}
.hero h1{font-size:34px;line-height:1.1;margin-bottom:6px}
.hero p{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px;min-height:112px;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:26px}
.tile b{font-size:15px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:auto;background:var(--accent);color:#fff;border-color:var(--accent)}
.tile.wide span{color:#d7e5e3}
.hero.photo{background-size:cover;background-position:center;color:#fff;border:0;min-height:360px;text-shadow:0 1px 8px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.hero.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.72) 85%)}
.hero.photo>*{position:relative}.hero.photo p{color:#eee}.hero.photo .chip{background:rgba(255,255,255,.9);color:var(--ink)}
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:12px;scrollbar-width:none}
.gallery img{flex:none;width:82%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;scroll-snap-align:start}
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin-top:8px}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.view{display:none}
.view.on{display:block}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent);font:600 14px Inter;padding:12px 0;cursor:pointer}
.view h2{font-size:30px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.card p,.card li{font-size:14.5px;color:#39454a}
.card ol,.card ul{padding-left:20px;display:grid;gap:6px}
.step{display:flex;gap:12px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font:600 15px Inter;cursor:pointer;text-decoration:none;background:var(--accent);color:#fff;margin-top:12px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.wifi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--bg);border-radius:12px;margin-top:8px}
.wifi small{color:var(--muted);display:block;font-size:12px}
.wifi code{font:600 16px ui-monospace,Menlo,monospace}
.copy{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font:600 13px Inter;color:var(--accent);cursor:pointer}
.place{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.place:first-of-type{border-top:0}
.place b{font-size:14.5px;display:block}
.place small{color:var(--muted);font-size:13px}
.place a{flex:none;font:600 13px Inter;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:500 13.5px Inter;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prod{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prod:first-child{border-top:0}
.prod .em{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:var(--bg);border-radius:12px;flex:none}
.prod .info{flex:1;min-width:0}
.prod b{font-size:14.5px;display:block}
.prod small{color:var(--muted);font-size:12.5px;display:block}
.prod .pr{font-weight:600;color:var(--gold);font-size:14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:600 18px Inter;color:var(--accent);cursor:pointer}
.qty span{min-width:16px;text-align:center;font-weight:600}
.cartbar{position:sticky;bottom:12px;margin-top:12px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:none;justify-content:space-between;align-items:center}
.cartbar.on{display:flex}
.cartbar button{background:#fff;color:var(--ink);border:0;border-radius:10px;padding:9px 14px;font:600 14px Inter;cursor:pointer}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=tel],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:15px Inter;background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:14.5px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.done{text-align:center;padding:28px 18px}
.done .big{font-size:48px}
.done h3{justify-content:center;font-family:"Cormorant Garamond",serif;font-size:26px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;transition:transform .25s,opacity .25s;opacity:0;z-index:9}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:28px}
footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Villa Bianca</div>
    <div class="lang"><button data-l="it">IT</button><button data-l="en">EN</button></div>
  </div>

  <!-- HOME -->
  <section class="view on" id="home">
    <div class="hero" id="hero">
      <h1 data-t="welcome"></h1>
      <p data-t="welcomeSub"></p>
      <div class="chips">
        <span class="chip" id="chipIn"></span>
        <span class="chip" id="chipOut"></span>
      </div>
    </div>
    <div class="grid">
      <button class="tile" data-go="arrivo"><span class="ic">🧭</span><b data-t="tArrive"></b><span data-t="tArriveSub"></span></button>
      <button class="tile" data-go="wifi"><span class="ic">📶</span><b>Wi-Fi</b><span data-t="tWifiSub"></span></button>
      <button class="tile" data-go="casa"><span class="ic">🏡</span><b data-t="tHouse"></b><span data-t="tHouseSub"></span></button>
      <button class="tile" data-go="dintorni"><span class="ic">🛒</span><b data-t="tAround"></b><span data-t="tAroundSub"></span></button>
      <button class="tile wide" data-go="shop"><span class="ic">🍷</span><div><b data-t="tShop"></b><br><span data-t="tShopSub"></span></div></button>
      <button class="tile wide" data-go="checkout" style="background:var(--card);color:var(--ink);border-color:var(--line)"><span class="ic">🔑</span><div><b>Check-out</b><br><span style="color:var(--muted)" data-t="tOutSub"></span></div></button>
    </div>
    <footer>
      <span data-t="help"></span><br>
      <a id="waLink" href="#">WhatsApp</a> · <a id="telLink" href="#" data-t="call"></a>
    </footer>
  </section>

  <!-- ARRIVO -->
  <section class="view" id="arrivo">
    <button class="back" data-go="home">← <span data-t="back"></span></button>
    <h2 data-t="tArrive"></h2>
    <div class="card" id="videoCard"><h3>🎬 <span data-t="videoTitle"></span></h3><div id="videoBox"></div></div>
    <div id="arrivoSteps"></div>
    <a class="btn" id="mapsBtn" target="_blank" rel="noopener">📍 <span data-t="openMaps"></span></a>
  </section>

  <!-- WIFI -->
  <section class="view" id="wifi">
    <button class="back" data-go="home">← <span data-t="back"></span></button>
    <h2>Wi-Fi</h2>
    <div class="card">
      <h3>📶 <span data-t="wifiConnect"></span></h3>
      <div class="wifi"><div><small data-t="network"></small><code id="ssid"></code></div><button class="copy" data-copy="ssid" data-t="copy"></button></div>
      <div class="wifi"><div><small>Password</small><code id="wpass"></code></div><button class="copy" data-copy="wpass" data-t="copy"></button></div>
      <p class="note" data-t="wifiNote"></p>
    </div>
  </section>

  <!-- CASA -->
  <section class="view" id="casa">
    <button class="back" data-go="home">← <span data-t="back"></span></button>
    <h2 data-t="tHouse"></h2>
    <div class="gallery" id="gallery"></div>
    <div id="casaList"></div>
  </section>

  <!-- DINTORNI -->
  <section class="view" id="dintorni">
    <button class="back" data-go="home">← <span data-t="back"></span></button>
    <h2 data-t="tAround"></h2>
    <div id="placesList"></div>
  </section>

  <!-- SHOP -->
  <section class="view" id="shop">
    <button class="back" data-go="home">← <span data-t="back"></span></button>
    <h2 data-t="tShop"></h2>
    <p class="note" style="margin:-6px 0 14px" data-t="shopIntro"></p>
    <div class="tabs" id="shopTabs"></div>
    <div class="card" id="prodList"></div>
    <div class="card" id="orderForm" style="display:none">
      <h3>🧾 <span data-t="yourOrder"></span></h3>
      <ul id="orderSummary" style="list-style:none;padding:0"></ul>
      <label class="f" data-t="yourName"></label>
      <input type="text" id="oName" autocomplete="name">
      <label class="f" data-t="notes"></label>
      <textarea id="oNote" data-tp="notesPh"></textarea>
      <p class="note" id="payNote"></p>
      <button class="btn" id="sendOrder" data-t="sendOrder"></button>
    </div>
    <div class="cartbar" id="cartbar"><span id="cartTxt"></span><button id="cartGo" data-t="review"></button></div>
  </section>

  <!-- CHECK-OUT -->
  <section class="view" id="checkout">
    <button class="back" data-go="home">← <span data-t="back"></span></button>
    <h2>Check-out</h2>
    <div id="outForm">
      <div class="card">
        <h3>✅ <span data-t="beforeLeave"></span></h3>
        <div id="outChecks"></div>
      </div>
      <div class="card">
        <label class="f" style="margin-top:0" data-t="yourName"></label>
        <input type="text" id="cName" autocomplete="name">
        <label class="f" data-t="phoneOpt"></label>
        <input type="tel" id="cPhone" autocomplete="tel" placeholder="+39 333 1234567">
        <label class="check"><input type="checkbox" id="cConsent"><span data-t="consent"></span></label>
        <button class="btn" id="sendOut" disabled data-t="didCheckout"></button>
        <p class="note" data-t="outNote"></p>
      </div>
    </div>
    <div class="card done" id="outDone" style="display:none">
      <div class="big">👋</div>
      <h3 data-t="thanks"></h3>
      <p data-t="thanksSub"></p>
      <a class="btn ghost" id="reviewBtn" target="_blank" rel="noopener">⭐ <span data-t="leaveReview"></span></a>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>

/* ===================== TESTI FISSI ===================== */
const T = {

/* ===================== LOGICA ===================== */
let L = (localStorage.getItem("vb-lang") || (navigator.language || "it")).slice(0, 2) === "it" ? "it" : "en";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const tx = o => (o && typeof o === "object") ? (o[L] ?? o.it) : o;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cart = {}; let cat = "all";

function render() {
  document.documentElement.lang = L;
  $$(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === L));
  $$("[data-t]").forEach(el => el.textContent = T[L][el.dataset.t]);
  $$("[data-tp]").forEach(el => el.placeholder = T[L][el.dataset.tp]);
  $("#chipIn").textContent = "Check-in " + CFG.checkin;
  $("#chipOut").textContent = "Check-out " + CFG.checkout;
  $("#waLink").href = "https://wa.me/" + CFG.whatsapp;
  $("#telLink").href = "tel:" + CFG.phone.replace(/\s/g, "");
  $("#mapsBtn").href = CFG.maps;
  $("#reviewBtn").href = CFG.googleReview;
  $("#ssid").textContent = CFG.wifi.ssid; $("#wpass").textContent = CFG.wifi.pass;
  $("#payNote").textContent = tx(CFG.payment);
  const yt = (CFG.video.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/) || [])[1];
  $("#videoCard").style.display = CFG.video.startsWith("[") ? "none" : "";
  $("#videoBox").innerHTML = yt ? `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${yt}" allowfullscreen></iframe></div>`
    : /\.(mp4|mov|webm)$/i.test(CFG.video) ? `<div class="video"><video src="${esc(CFG.video)}" controls playsinline preload="metadata"></video></div>`
    : `<a class="btn" href="${esc(CFG.video)}" target="_blank" rel="noopener">▶ ${T[L].watchVideo}</a>`;
  if (CFG.foto.length) { $("#hero").classList.add("photo"); $("#hero").style.backgroundImage = `url("${CFG.foto[0]}")`; }
  $("#gallery").innerHTML = CFG.foto.map(u => `<img src="${esc(u)}" alt="" loading="lazy">`).join("");
  $("#arrivoSteps").innerHTML = CFG.arrivo.filter(s => !s.soloVideo || !CFG.video.startsWith("[")).map((s, i) =>
    `<div class="card step"><span class="num">${i + 1}</span><div><p>${esc(tx(s))}</p>${s.img ? `<img src="${esc(s.img)}" alt="" loading="lazy" style="width:100%;border-radius:12px;margin-top:10px;max-height:320px;object-fit:cover">` : ""}</div></div>`).join("");
  $("#casaList").innerHTML = CFG.casa.map(c =>
    `<div class="card"><h3>${c.ic} ${esc(tx(c.t))}</h3><p>${esc(tx(c.d))}</p></div>`).join("");
  $("#placesList").innerHTML = `<div class="card">` + CFG.posti.map(p =>
    `<div class="place"><div><b>${esc(p.n)}</b><small>${esc(tx(p.d))}</small></div><a href="${esc(p.map)}" target="_blank" rel="noopener">Maps</a></div>`).join("") + `</div>`;
  $("#outChecks").innerHTML = CFG.checklist.map((c, i) =>
    `<label class="check"><input type="checkbox" class="oc" data-i="${i}"><span>${esc(tx(c))}</span></label>`).join("");
  $$(".oc").forEach(c => c.onchange = checkReady);
  renderShop(); checkReady();
}

function renderShop() {
  const cats = ["all", ...Object.keys(CFG.categorie)];
  $("#shopTabs").innerHTML = cats.map(c =>
    `<button class="${c === cat ? "on" : ""}" data-c="${c}">${c === "all" ? T[L].all : esc(tx(CFG.categorie[c]))}</button>`).join("");
  $$("#shopTabs button").forEach(b => b.onclick = () => { cat = b.dataset.c; renderShop(); });
  $("#prodList").innerHTML = CFG.prodotti.filter(p => cat === "all" || p.cat === cat).map(p => `
    <div class="prod"><span class="em">${p.em}</span>
      <div class="info"><b>${esc(tx(p.n))}</b><small>${esc(tx(p.d))}</small><span class="pr">€ ${p.p.toFixed(2)}</span></div>
      <div class="qty"><button data-m="${p.id}">−</button><span>${cart[p.id] || 0}</span><button data-p="${p.id}">+</button></div>
    </div>`).join("");
  $$("[data-p]").forEach(b => b.onclick = () => { cart[b.dataset.p] = (cart[b.dataset.p] || 0) + 1; renderShop(); });
  $$("[data-m]").forEach(b => b.onclick = () => { const k = b.dataset.m; if (cart[k]) cart[k]--; if (!cart[k]) delete cart[k]; renderShop(); });
  const lines = orderLines(), n = lines.reduce((a, l) => a + l.q, 0), tot = lines.reduce((a, l) => a + l.q * l.p, 0);
  $("#cartbar").classList.toggle("on", n > 0 && $("#orderForm").style.display === "none");
  $("#cartTxt").textContent = `${n} ${T[L].items} · € ${tot.toFixed(2)}`;
  $("#orderSummary").innerHTML = lines.map(l => `<li class="place"><span>${l.q} × ${esc(l.nl)}</span><b>€ ${(l.q * l.p).toFixed(2)}</b></li>`).join("")
    + `<li class="place"><b>${T[L].total}</b><b>€ ${tot.toFixed(2)}</b></li>`;
  if (!n) $("#orderForm").style.display = "none";
}
const orderLines = () => Object.entries(cart).map(([id, q]) => {
  const p = CFG.prodotti.find(x => x.id === id); return { q, n: p.n.it, nl: tx(p.n), p: p.p };
});

function checkReady() {
  const all = $$(".oc").every(c => c.checked);
  $("#sendOut").disabled = !all || !$("#cName").value.trim();
}

async function send(data) {
  // form-urlencoded = richiesta "semplice", nessun problema di CORS con n8n
  await fetch(CFG.webhook, { method: "POST", mode: "no-cors", body: new URLSearchParams(data) });
}

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2600); }

function go(id) {
  $$(".view").forEach(v => v.classList.toggle("on", v.id === id));
  if (location.hash.slice(1) !== id) history.pushState(null, "", id === "home" ? location.pathname : "#" + id);
  window.scrollTo(0, 0);
}

$$("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
window.onpopstate = () => go(location.hash.slice(1) || "home");
$$(".lang button").forEach(b => b.onclick = () => { L = b.dataset.l; try { localStorage.setItem("vb-lang", L); } catch (e) {} render(); });
$$("[data-copy]").forEach(b => b.onclick = async () => {
  try { await navigator.clipboard.writeText($("#" + b.dataset.copy).textContent); toast(T[L].copied); } catch (e) {}
});
$("#cName").oninput = checkReady;
$("#cartGo").onclick = () => { $("#orderForm").style.display = "block"; $("#cartbar").classList.remove("on"); $("#orderForm").scrollIntoView({ behavior: "smooth" }); };

$("#sendOrder").onclick = async () => {
  const lines = orderLines(); if (!lines.length) return;
  const btn = $("#sendOrder"); btn.disabled = true;
  try {
    await send({
      tipo: "ordine", casa: "Villa Bianca", lingua: L,
      nome: $("#oName").value.trim(), note: $("#oNote").value.trim(),
      ordine: lines.map(l => `${l.q} x ${l.n} (€ ${(l.q * l.p).toFixed(2)})`).join("\n"),
      totale: lines.reduce((a, l) => a + l.q * l.p, 0).toFixed(2)
    });
    Object.keys(cart).forEach(k => delete cart[k]);
    $("#orderForm").style.display = "none"; $("#oNote").value = "";
    renderShop(); toast(T[L].orderSent);
  } catch (e) { toast(T[L].err); }
  btn.disabled = false;
};

$("#sendOut").onclick = async () => {
  const btn = $("#sendOut"); btn.disabled = true;
  try {
    await send({
      tipo: "checkout", casa: "Villa Bianca", lingua: L,
      nome: $("#cName").value.trim(), telefono: $("#cPhone").value.trim(),
      consenso_sms: $("#cConsent").checked ? "si" : "no"
    });
    $("#outForm").style.display = "none"; $("#outDone").style.display = "block";
  } catch (e) { toast(T[L].err); btn.disabled = false; }
};

render();
if (location.hash) go(location.hash.slice(1));
</script>
</body>
</html>
